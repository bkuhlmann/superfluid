exclude_paths:
  - tmp
  - vendor

detectors:
  ControlParameter:
    exclude:
      - Superfluid::Register#call
  LongParameterList:
    enabled: false
  UnusedParameters:
    enabled: false
  FeatureEnvy:
    exclude:
      - Superfluid::Filters::Common#append
      - Superfluid::Filters::Common#prepend
